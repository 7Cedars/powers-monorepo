name: CI (staging)

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-source-branch:
    name: Check source branch
    runs-on: ubuntu-latest
    steps:
      - name: Fail if not from develop
        if: github.event_name == 'pull_request' && github.head_ref != 'develop'
        run: |
          echo "PRs to staging must come from the develop branch (got: ${{ github.head_ref }})"
          exit 1

  solidity-tests:
    name: Solidity Tests
    runs-on: ubuntu-latest
    needs: check-source-branch
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry lib
        uses: actions/cache@v4
        with:
          path: solidity/lib
          key: foundry-lib-${{ hashFiles('solidity/.gitmodules') }}
          restore-keys: foundry-lib-

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: cd solidity && forge fmt --check

      - name: Build contracts
        run: cd solidity && forge build --sizes

      - name: Run tests
        run: cd solidity && forge test -vvv

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check-source-branch
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Copy env file
        run: cp .env.example .env

      - name: Run E2E tests
        run: pnpm test:e2e
